<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dachia Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#3a1d3c;--lilac:#f5f0f6;--gold:#d08a0b;--ink:#241626;--line:#e1d6e4;--white:#fff}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Figtree,system-ui,sans-serif;background:var(--lilac);color:var(--ink)}
h1,h2,.brand{font-family:"Bricolage Grotesque",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--plum);color:#fff}
.brand{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--gold);color:#1b1000;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.hero{padding:9vh 5vw 5vh;max-width:900px}.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;margin:0 0 14px;letter-spacing:-.03em;color:var(--plum)}
.hero p{max-width:46ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:20px 5vw 8vh}
.card{background:var(--white);border-radius:6px 22px 6px 22px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.card div{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h2{margin:0;font-size:1.1rem}.card p{margin:0;font-size:.92rem;opacity:.75;flex:1}
.price{font-weight:700;color:var(--plum)}
.empty{padding:0 5vw 10vh;opacity:.7}
aside{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--white);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0003}
aside.open{transform:none}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.ch h2{margin:0}
#items{flex:1;overflow:auto;padding:8px 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.q button{padding:2px 10px;background:var(--line);color:var(--ink)}.q{display:flex;gap:8px;align-items:center}
.foot{padding:16px;border-top:1px solid var(--line);display:grid;gap:8px}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%}
.total{display:flex;justify-content:space-between;font-weight:700}
#msg{padding:12px 16px;background:#e6f4e6;margin:12px;border-radius:8px;display:none}
</style></head><body>
<header><span class="brand">Dachia Collections</span><button id="open" class="ghost">Cart (<span id="cnt">0</span>)</button></header>
<section class="hero"><h1>Pick what you love. We'll take it from there.</h1><p>Add items to your cart, press Done, and your order reaches us straight away.</p></section>
<div id="msg" role="status"></div>
<main id="grid" class="grid"></main><p id="empty" class="empty" hidden>New products are coming soon.</p>
<aside id="cart" aria-label="Your cart">
 <div class="ch"><h2>Your cart</h2><button id="close" class="ghost">Close</button></div>
 <div id="items"></div>
 <div class="foot">
  <div class="total"><span>Total</span><span id="tot">₦0</span></div>
  <input id="n" placeholder="Your name" autocomplete="name">
  <input id="p" placeholder="Phone / WhatsApp number" inputmode="tel" autocomplete="tel">
  <textarea id="a" rows="2" placeholder="Delivery address or notes"></textarea>
  <button id="done">Done – send my order</button>
 </div>
</aside>
<script type="module">
import {db,money,esc} from "./firebase-config.js";
import {collection,onSnapshot,query,orderBy,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);
let products={},cart=JSON.parse(localStorage.getItem("dachia-cart")||"{}");
const save=()=>localStorage.setItem("dachia-cart",JSON.stringify(cart));
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),s=>{
 products={};s.forEach(d=>products[d.id]={id:d.id,...d.data()});
 const l=Object.values(products);$("empty").hidden=l.length>0;
 $("grid").innerHTML=l.map(p=>`<article class="card"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"><div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span><button data-add="${p.id}">Add to cart</button></div></article>`).join("");
 render();
});
$("grid").onclick=e=>{const id=e.target.dataset.add;if(!id)return;cart[id]=(cart[id]||0)+1;save();render();$("cart").classList.add("open")};
function render(){
 let t=0,c=0,h="";
 for(const id in cart){const p=products[id];if(!p){delete cart[id];continue}
  t+=p.price*cart[id];c+=cart[id];
  h+=`<div class="row"><b>${esc(p.name)}</b><span>${money(p.price*cart[id])}</span><div class="q"><button data-m="${id}" aria-label="Fewer">−</button>${cart[id]}<button data-p="${id}" aria-label="More">+</button></div><button class="ghost" data-r="${id}" style="padding:2px 10px">Remove</button></div>`}
 $("items").innerHTML=h||"<p>Your cart is empty.</p>";$("tot").textContent=money(t);$("cnt").textContent=c;save();
}
$("items").onclick=e=>{const d=e.target.dataset;
 if(d.p)cart[d.p]++;if(d.m&&--cart[d.m]<1)delete cart[d.m];if(d.r)delete cart[d.r];render()};
$("open").onclick=()=>$("cart").classList.add("open");$("close").onclick=()=>$("cart").classList.remove("open");
$("done").onclick=async()=>{
 const ids=Object.keys(cart);
 if(!ids.length)return alert("Add at least one item first.");
 if(!$("n").value.trim()||!$("p").value.trim())return alert("Please enter your name and phone number.");
 const items=ids.map(id=>({id,name:products[id].name,price:products[id].price,qty:cart[id]}));
 const total=items.reduce((s,i)=>s+i.price*i.qty,0);
 $("done").disabled=true;
 try{
  await addDoc(collection(db,"orders"),{customer:{name:$("n").value.trim(),phone:$("p").value.trim(),address:$("a").value.trim()},items,total,status:"new",createdAt:serverTimestamp()});
  cart={};save();render();$("cart").classList.remove("open");
  const m=$("msg");m.textContent="Thank you! Your order was sent to Dachia Collections. We'll contact you shortly.";m.style.display="block";scrollTo(0,0);
 }catch(err){alert("Couldn't send your order. Check your connection and try again.")}
 $("done").disabled=false;
};
</script></body></html>
