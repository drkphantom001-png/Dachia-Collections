<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dachia Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A33; --paper:#F2F1EC; --line:#D8D5CC;
    --gold:#C68B3C; --gold-dark:#a5721f;
    --green:#3C5A4A;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  header{
    position:sticky;top:0;z-index:10;background:var(--paper);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:1.1rem 1.5rem;
  }
  header h1{font-size:1.4rem;}
  #cart-btn{
    background:var(--ink);color:var(--paper);border:none;border-radius:2px;
    padding:.6rem 1rem;font-family:'Inter';font-weight:600;cursor:pointer;font-size:.95rem;
    display:flex;align-items:center;gap:.5rem;
  }
  #cart-count{background:var(--gold);color:#fff;border-radius:50%;min-width:1.4rem;height:1.4rem;
    display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;}
  main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  #empty-state{text-align:center;color:#7a766c;padding:4rem 1rem;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem;}
  .card{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e7e4dc;}
  .card .body{padding:.9rem 1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1;}
  .card h3{font-size:1.05rem;}
  .card p{margin:0;color:#5c584f;font-size:.88rem;flex:1;}
  .price{font-weight:600;color:var(--green);font-size:1rem;}
  .add-btn{margin-top:.5rem;background:none;border:1.5px solid var(--ink);color:var(--ink);
    border-radius:2px;padding:.5rem;font-weight:600;cursor:pointer;font-family:'Inter';}
  .add-btn:hover{background:var(--ink);color:#fff;}
  /* cart drawer */
  #overlay{position:fixed;inset:0;background:rgba(20,20,15,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  #overlay.open{opacity:1;pointer-events:auto;}
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--paper);
    box-shadow:-8px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;
    z-index:21;display:flex;flex-direction:column;}
  #drawer.open{transform:translateX(0);}
  #drawer-head{padding:1.2rem 1.4rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  #close-cart{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink);}
  #cart-items{flex:1;overflow-y:auto;padding:1rem 1.4rem;}
  .line{display:flex;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--line);align-items:center;}
  .line img{width:56px;height:56px;object-fit:cover;border-radius:2px;background:#e7e4dc;}
  .line .info{flex:1;}
  .line .info h4{margin:0 0 .2rem;font-size:.92rem;font-weight:600;}
  .qty{display:flex;align-items:center;gap:.5rem;}
  .qty button{width:24px;height:24px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:2px;}
  #cart-footer{padding:1.2rem 1.4rem;border-top:1px solid var(--line);}
  #total-row{display:flex;justify-content:space-between;font-weight:600;margin-bottom:1rem;font-size:1.05rem;}
  .field{margin-bottom:.7rem;}
  .field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.25rem;}
  .field input,.field textarea{width:100%;padding:.55rem .65rem;border:1px solid var(--line);border-radius:2px;font-family:'Inter';font-size:.92rem;background:#fff;}
  #place-order{width:100%;background:var(--gold);color:#fff;border:none;padding:.8rem;border-radius:2px;
    font-weight:600;font-size:1rem;cursor:pointer;font-family:'Inter';}
  #place-order:hover{background:var(--gold-dark);}
  #place-order:disabled{opacity:.5;cursor:default;}
  #confirm{display:none;text-align:center;padding:2rem 1rem;}
  #confirm h3{margin-bottom:.5rem;}
  .muted{color:#7a766c;font-size:.85rem;}
  #cart-empty{color:#7a766c;padding:2rem 0;text-align:center;}
</style>
</head>
<body>

<header>
  <h1 id="store-title">Dachia Collections</h1>
  <button id="cart-btn" onclick="openCart()">Cart <span id="cart-count">0</span></button>
</header>

<main>
  <div id="empty-state" style="display:none;">No products yet — check back soon.</div>
  <div id="grid"></div>
</main>

<div id="overlay" onclick="closeCart()"></div>
<div id="drawer">
  <div id="drawer-head">
    <h3>Your order</h3>
    <button id="close-cart" onclick="closeCart()">&times;</button>
  </div>

  <div id="cart-body">
    <div id="cart-items"></div>
    <div id="cart-footer">
      <div id="total-row"><span>Total</span><span id="total">₦0</span></div>
      <form id="checkout-form">
        <div class="field"><label>Full name</label><input id="c-name" required></div>
        <div class="field"><label>Phone number</label><input id="c-phone" required></div>
        <div class="field"><label>Delivery address</label><textarea id="c-address" rows="2" required></textarea></div>
        <div class="field"><label>Note (optional)</label><input id="c-note"></div>
        <button id="place-order" type="submit">Done — place order</button>
      </form>
    </div>
  </div>

  <div id="confirm">
    <h3>Order placed ✓</h3>
    <p class="muted">Thanks — the seller has received your order and will reach out to confirm delivery.</p>
    <button class="add-btn" style="margin-top:1rem;" onclick="closeCart()">Close</button>
  </div>
</div>

<script type="module">
import { firebaseConfig, STORE_NAME } from './firebase-config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.getElementById('store-title').textContent = STORE_NAME;
document.title = STORE_NAME;

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = JSON.parse(localStorage.getItem('cart') || '{}'); // {productId: qty}

const grid = document.getElementById('grid');
const emptyState = document.getElementById('empty-state');

onSnapshot(query(collection(db, 'products'), orderBy('createdAt', 'desc')), snap => {
  products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderGrid();
  renderCart();
});

function renderGrid(){
  if(!products.length){ emptyState.style.display='block'; grid.innerHTML=''; return; }
  emptyState.style.display='none';
  grid.innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.imageUrl || ''}" alt="${escapeHtml(p.name)}" onerror="this.style.opacity=0">
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        <p>${escapeHtml(p.description || '')}</p>
        <span class="price">₦${Number(p.price).toLocaleString()}</span>
        <button class="add-btn" onclick="addToCart('${p.id}')">Add to cart</button>
      </div>
    </div>
  `).join('');
}

window.addToCart = (id) => {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  openCart();
};
window.changeQty = (id, delta) => {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
};
function saveCart(){
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function renderCart(){
  const ids = Object.keys(cart);
  document.getElementById('cart-count').textContent = ids.reduce((s,id)=>s+cart[id],0);
  const itemsEl = document.getElementById('cart-items');
  if(!ids.length){
    itemsEl.innerHTML = '<div id="cart-empty">Your cart is empty.</div>';
    document.getElementById('place-order').disabled = true;
    document.getElementById('total').textContent = '₦0';
    return;
  }
  document.getElementById('place-order').disabled = false;
  let total = 0;
  itemsEl.innerHTML = ids.map(id => {
    const p = products.find(p => p.id === id);
    if(!p) return '';
    const qty = cart[id];
    total += p.price * qty;
    return `
      <div class="line">
        <img src="${p.imageUrl || ''}" onerror="this.style.opacity=0">
        <div class="info">
          <h4>${escapeHtml(p.name)}</h4>
          <span class="muted">₦${Number(p.price).toLocaleString()} each</span>
        </div>
        <div class="qty">
          <button type="button" onclick="changeQty('${id}',-1)">–</button>
          <span>${qty}</span>
          <button type="button" onclick="changeQty('${id}',1)">+</button>
        </div>
      </div>`;
  }).join('');
  document.getElementById('total').textContent = '₦' + total.toLocaleString();
}

window.openCart = () => {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('cart-body').style.display = 'flex';
  document.getElementById('cart-body').style.flexDirection = 'column';
  document.getElementById('cart-body').style.flex = '1';
  document.getElementById('confirm').style.display = 'none';
};
window.closeCart = () => {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

document.getElementById('checkout-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ids = Object.keys(cart);
  if(!ids.length) return;
  const items = ids.map(id => {
    const p = products.find(p => p.id === id);
    return { productId: id, name: p.name, price: p.price, qty: cart[id] };
  });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const btn = document.getElementById('place-order');
  btn.disabled = true; btn.textContent = 'Placing order…';
  try{
    await addDoc(collection(db,'orders'), {
      items, total,
      customerName: document.getElementById('c-name').value,
      customerPhone: document.getElementById('c-phone').value,
      customerAddress: document.getElementById('c-address').value,
      note: document.getElementById('c-note').value,
      status: 'new',
      createdAt: serverTimestamp()
    });
    cart = {}; saveCart();
    document.getElementById('cart-body').style.display = 'none';
    document.getElementById('confirm').style.display = 'block';
    e.target.reset();
  }catch(err){
    alert('Could not place order — please check your connection and try again.');
    console.error(err);
  }finally{
    btn.disabled = false; btn.textContent = 'Done — place order';
  }
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
