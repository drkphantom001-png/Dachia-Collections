<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dachia Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--esp:#2e1c12;--cof:#6b4429;--car:#b8814f;--milk:#f5ede2;--cream:#fffaf3;--line:#e6d9c8;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 Figtree,system-ui,sans-serif;background:var(--cream);color:var(--esp)}
h1,h2,.brand{font-family:Fraunces,Georgia,serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:#fffaf3e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;color:var(--esp)}.brand i{color:var(--car);font-style:normal}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:11px 20px;background:var(--esp);color:var(--cream);font-weight:600;transition:background .2s,transform .2s}
button:hover{background:var(--cof)}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--car);outline-offset:2px}
button.ghost{background:transparent;color:var(--esp);border:1.5px solid var(--esp)}button.ghost:hover{background:var(--esp);color:var(--cream)}
.hero{position:relative;overflow:hidden;padding:12vh 5vw 11vh;background:linear-gradient(135deg,var(--milk),#ecd9c1)}
.hero:after{content:"";position:absolute;right:-12vw;top:-14vw;width:46vw;height:46vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c99565,var(--cof));opacity:.9}
.hero>*{position:relative;z-index:1;max-width:620px}
.tag{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cof);font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(2.6rem,8vw,5.2rem);line-height:.98;margin:0 0 18px;letter-spacing:-.03em}
.hero p{margin:0 0 26px;font-size:1.1rem;max-width:42ch;color:#4a3426}
.hero a{display:inline-block;text-decoration:none;background:var(--esp);color:var(--cream);padding:14px 28px;border-radius:99px;font-weight:600}
h2.sec{font-size:2rem;margin:0;padding:56px 5vw 0;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;padding:24px 5vw 9vh}
.card{background:var(--white);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 6px 24px #6b44291a;transition:transform .3s,box-shadow .3s;animation:up .5s both}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 36px #6b442930}
.im{overflow:hidden;aspect-ratio:1;background:var(--milk)}
.im img{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block}.card:hover .im img{transform:scale(1.07)}
.bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.bd h3{margin:0;font:700 1.15rem Fraunces,serif}.bd p{margin:0;font-size:.92rem;color:#6e5646;flex:1}
.price{font-weight:700;font-size:1.1rem;color:var(--cof);margin:4px 0 6px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{padding:20px 5vw 10vh;color:#6e5646}
aside{position:fixed;inset:0 0 0 auto;width:min(430px,100%);background:var(--cream);z-index:10;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-12px 0 40px #2e1c1240}
aside.open{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line)}.ch h2{margin:0;font-size:1.5rem}
#items{flex:1;overflow:auto;padding:8px 18px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.q{display:flex;gap:10px;align-items:center}.q button{padding:2px 12px;background:var(--milk);color:var(--esp)}
.rm{padding:3px 12px;font-size:.85rem}
.foot{padding:18px;border-top:1px solid var(--line);display:grid;gap:9px;background:var(--milk)}
input,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;width:100%;background:#fff;color:var(--esp)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem}
#msg{display:none;margin:20px 5vw 0;padding:16px 20px;background:var(--milk);border-left:5px solid var(--car);border-radius:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--esp);color:var(--cream);padding:12px 22px;border-radius:99px;z-index:20;transition:transform .3s}
#toast.on{transform:translate(-50%,0)}
footer{text-align:center;padding:28px;color:#6e5646;border-top:1px solid var(--line);font-size:.9rem}
</style></head><body>
<header><span class="brand">Dachia <i>Collections</i></span><button id="open" class="ghost">Cart (<span id="cnt">0</span>)</button></header>
<section class="hero"><span class="tag">New arrivals</span><h1>Pieces you'll love, picked with care.</h1><p>Add what you like to your cart, press Done, and your order reaches us straight away.</p><a href="#shop">Shop the collection</a></section>
<div id="msg" role="status"></div>
<h2 class="sec" id="shop">The collection</h2>
<main id="grid" class="grid"></main><p id="empty" class="empty" hidden>New products are coming soon.</p>
<footer>© Dachia Collections</footer>
<div id="toast" role="status"></div>
<aside id="cart" aria-label="Your cart">
 <div class="ch"><h2>Your cart</h2><button id="close" class="ghost">Close</button></div>
 <div id="items"></div>
 <div class="foot">
  <div class="total"><span>Total</span><span id="tot">₦0</span></div>
  <input id="n" placeholder="Your name" autocomplete="name">
  <input id="p" placeholder="Phone / WhatsApp number" inputmode="tel" autocomplete="tel">
  <textarea id="a" rows="2" placeholder="Delivery address or notes"></textarea>
  <button id="done">Done – send my order</button>
 </div>
</aside>
<script type="module">
import {db,money,esc} from "./firebase-config.js";
import {collection,onSnapshot,query,orderBy,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);
let products={},cart=JSON.parse(localStorage.getItem("dachia-cart")||"{}"),tt;
const save=()=>localStorage.setItem("dachia-cart",JSON.stringify(cart));
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)};
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),s=>{
 products={};s.forEach(d=>products[d.id]={id:d.id,...d.data()});
 const l=Object.values(products);$("empty").hidden=l.length>0;
 $("grid").innerHTML=l.map(p=>`<article class="card"><div class="im"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></div><div class="bd"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span><button data-add="${p.id}">Add to cart</button></div></article>`).join("");
 render();
});
$("grid").onclick=e=>{const id=e.target.dataset.add;if(!id)return;cart[id]=(cart[id]||0)+1;save();render();toast("Added to your cart")};
function render(){
 let t=0,c=0,h="";
 for(const id in cart){const p=products[id];if(!p){delete cart[id];continue}
  t+=p.price*cart[id];c+=cart[id];
  h+=`<div class="row"><b>${esc(p.name)}</b><span>${money(p.price*cart[id])}</span><div class="q"><button data-m="${id}" aria-label="Fewer">−</button>${cart[id]}<button data-p="${id}" aria-label="More">+</button></div><button class="ghost rm" data-r="${id}">Remove</button></div>`}
 $("items").innerHTML=h||"<p>Your cart is empty.</p>";$("tot").textContent=money(t);$("cnt").textContent=c;save();
}
$("items").onclick=e=>{const d=e.target.dataset;
 if(d.p)cart[d.p]++;if(d.m&&--cart[d.m]<1)delete cart[d.m];if(d.r)delete cart[d.r];render()};
$("open").onclick=()=>$("cart").classList.add("open");$("close").onclick=()=>$("cart").classList.remove("open");
$("done").onclick=async()=>{
 const ids=Object.keys(cart);
 if(!ids.length)return alert("Add at least one item first.");
 if(!$("n").value.trim()||!$("p").value.trim())return alert("Please enter your name and phone number.");
 const items=ids.map(id=>({id,name:products[id].name,price:products[id].price,qty:cart[id]}));
 const total=items.reduce((s,i)=>s+i.price*i.qty,0);
 $("done").disabled=true;
 try{
  await addDoc(collection(db,"orders"),{customer:{name:$("n").value.trim(),phone:$("p").value.trim(),address:$("a").value.trim()},items,total,status:"new",createdAt:serverTimestamp()});
  cart={};save();render();$("cart").classList.remove("open");
  const m=$("msg");m.textContent="Thank you! Your order was sent to Dachia Collections. We'll contact you shortly.";m.style.display="block";scrollTo(0,0);
 }catch(err){alert("Couldn't send your order. Check your connection and try again.")}
 $("done").disabled=false;
};
</script></body></html>
